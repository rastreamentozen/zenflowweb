<script>
    console.log("🟢 [ZENFLOW] Módulo JS_Global carregado.");

    // =======================================================================
    // VARIÁVEIS GLOBAIS E ESTADOS
    // =======================================================================
    let cacheFilaBase = [], cacheFilaFiltrada = [], cacheLogsBase = { colunas: [], linhas: [], isHtml: false }, cacheLoteParsed = [];
    let colunaOrdenacao = 'etapaNum', ordemAscendente = true, currentPage = 1, rowsPerPage = 50, selectionSet = new Set(); 
    let currentLogPage = 1, rowsPerLogPage = 50, cacheLogsFiltrados = [];
    let cacheFilaCancBase = [], cacheFilaCancFiltrada = [], selectionSetCanc = new Set();
    let cacheTecnicosGeral = []; let colunaOrdenacaoTec = 'nome'; let ordemAscendenteTec = true;
    let cacheUsuarios = [];
    let usuarioLogado = null, tempUserParaTroca = null; 

    const BADGES_SGA = {
      "CANCELADO": { txt: "CANCELADO", css: "bg-rose-100 text-rose-800 border-rose-300 dark:bg-rose-900/50 dark:text-rose-300" },
      "CANCELADO COM RASTREADOR": { txt: "CANC. C/ RASTREADOR", css: "bg-red-100 text-red-800 border-red-300 dark:bg-red-900/50 dark:text-red-300" },
      "CANCELAMENTO PENDENTE": { txt: "CANC. PENDENTE", css: "bg-orange-100 text-orange-800 border-orange-300 dark:bg-orange-900/50 dark:text-orange-300" },
      "DESLIGADO DO CORPO ASSOCIATIVO": { txt: "DESLIGADO", css: "bg-slate-200 text-slate-800 border-slate-400 dark:bg-slate-700 dark:text-slate-300" },
      "INATIVO": { txt: "INATIVO", css: "bg-purple-100 text-purple-800 border-purple-300 dark:bg-purple-900/50 dark:text-purple-300" },
      "INATIVOS COM RASTREADOR": { txt: "INATIVO C/ RAST", css: "bg-fuchsia-100 text-fuchsia-800 border-fuchsia-300 dark:bg-fuchsia-900/50 dark:text-fuchsia-300" },
      "INATIVOS SEM RASTREADOR": { txt: "INATIVO S/ RAST", css: "bg-violet-100 text-violet-800 border-violet-300 dark:bg-violet-900/50 dark:text-violet-300" },
      "INADIMPLENTE": { txt: "INADIMPLENTE", css: "bg-yellow-100 text-yellow-800 border-yellow-300 dark:bg-yellow-900/50 dark:text-yellow-300" },
      "AGUARDANDO INDENIZAÇÃO": { txt: "AGUARD. INDENIZAÇÃO", css: "bg-sky-100 text-sky-800 border-sky-300 dark:bg-sky-900/50 dark:text-sky-300" },
      "INDENIZADO": { txt: "INDENIZADO", css: "bg-cyan-100 text-cyan-800 border-cyan-300 dark:bg-cyan-900/50 dark:text-cyan-300" },
      "NEGADO": { txt: "NEGADO", css: "bg-gray-100 text-gray-800 border-gray-300 dark:bg-gray-700 dark:text-gray-300" }
    };
//Funções// 

function dispararEmailBackendPromise(grupo, responsavel) { 
        return new Promise((resolve, reject) => { 
            google.script.run
                .withSuccessHandler(res => resolve(res))
                .withFailureHandler(err => reject(err))
                .dispararEmailAgrupadoWeb([grupo], responsavel); 
        }); 
    }

    function formatarMoedaBRL(valor) { 
        if (!valor) return 'Sem FIPE'; 
        let str = String(valor).replace(/R\$\s?/gi, '').trim(); 
        if (str === '') return 'Sem FIPE'; 
        if (str.indexOf(',') > -1) { str = str.replace(/\./g, '').replace(',', '.'); } 
        let num = parseFloat(str); 
        if (isNaN(num)) return '💰 R$ ' + String(valor).replace(/R\$\s?/gi, '').trim(); 
        return '💰 R$ ' + new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num); 
    }

    function gerarLinkWhats(telefone, mensagem) { 
        if (!telefone || String(telefone).trim() === '') return `<span class="text-slate-400 text-[10px] italic">Sem Whats</span>`; 
        const num = String(telefone).replace(/\D/g, ''); 
        const msg = encodeURIComponent(mensagem || ""); 
        return `<a href="https://wa.me/55${num}?text=${msg}" target="_blank" class="text-emerald-600 dark:text-emerald-400 hover:text-emerald-700 font-bold text-[11px] flex items-center gap-1 mt-1 transition"><span class="text-sm">💬</span> WhatsApp</a>`; 
    }

    function getTimestamp(dataStr) { 
        if (!dataStr) return 0; 
        let str = String(dataStr).trim();
        if (str === "Aguardando..." || str === "" || str === "undefined") return 0; 
        
        if (str.includes("GMT") || str.includes("T")) {
            return new Date(str).getTime();
        }

        const partes = str.split(" ");
        const d = partes[0] ? partes[0].split("/") : [0,0,0]; 
        const t = partes[1] ? partes[1].split(":") : [0, 0]; 
        
        if(d.length === 3) {
            return new Date(d[2], d[1] - 1, d[0], t[0] || 0, t[1] || 0).getTime(); 
        }
        return 0;
    }

    function abrirNovaAba(view) { 
        if(typeof APP_URL !== 'undefined' && APP_URL !== "") {
            window.open(APP_URL + "?view=" + view, "_blank"); 
        } else {
            aviso("⚠️ Erro: Acesse pelo link oficial."); 
        }
    }

    function toggleMenu(id, event) { 
        event.stopPropagation(); 
        const menu = document.getElementById(id); 
        if(!menu) return; 
        const isHidden = menu.classList.contains('hidden'); 
        document.querySelectorAll('.menu-flutuante').forEach(el => el.classList.add('hidden')); 
        if (isHidden) menu.classList.remove('hidden'); 
    }

    document.addEventListener('click', () => { 
        document.querySelectorAll('.menu-flutuante').forEach(el => el.classList.add('hidden')); 
    });

    function toggleDarkMode() { 
        document.documentElement.classList.toggle('dark'); 
        const isDark = document.documentElement.classList.contains('dark'); 
        localStorage.setItem('theme', isDark ? 'dark' : 'light'); 
        const tI = document.getElementById('theme-icon'); 
        if (tI) tI.innerText = isDark ? '☀️' : '🌙'; 
    }

    function aviso(texto, tempo = 5000, isHtml = false) { 
        const el = document.getElementById("toast"); 
        if(!el) return; 
        if (isHtml) el.innerHTML = texto; else el.innerText = texto; 
        el.classList.remove("hidden"); 
        if (tempo > 0) setTimeout(() => el.classList.add("hidden"), tempo); 
    }

    function imprimirTabela(titulo, cabecalhos, linhasHTML) {
       const w = window.open('', '_blank');
       const htmlContent = '<!DOCTYPE html><html><head><title>Relatório - ' + titulo + '</title><style>body { padding: 20px; font-family: sans-serif; background: white; color: black; } @media print { body { padding: 0; } @page { margin: 1cm; size: landscape; } } table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 11px; text-align: left; } th, td { border: 1px solid #ccc; padding: 6px 10px; } th { background-color: #f1f5f9; font-weight: bold; color: #334155; text-transform: uppercase; font-size: 10px; } td { vertical-align: top; } h1 { font-size: 20px; font-weight: bold; margin-bottom: 4px; } p { color: #666; font-size: 12px; margin-bottom: 20px; }</style></head><body><h1>Relatório Operacional: ' + titulo + '</h1><p>Gerado em: ' + new Date().toLocaleString('pt-BR') + '</p><table><thead><tr>' + cabecalhos.map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' + linhasHTML + '</tbody></table></body></html>';
       w.document.write(htmlContent); 
       w.document.close(); 
       
       // Garante que o CSS aplique antes da caixa de diálogo do print
       w.onload = function() {
           w.setTimeout(function() { w.print(); w.close(); }, 800);
       };
    }

    function dispararImpressaoFila() {
       if (!cacheFilaFiltrada || cacheFilaFiltrada.length === 0) return aviso("⚠️ Nenhum dado na tabela para imprimir.");
       const cabecalhos = ["Etapa", "Cliente", "Veículo / FIPE", "Data Entrada", "Data Envio", "Contato", "Localização", "Fipe Baixa", "Resp. Email", "Resp. Whats"];
       const linhasHTML = cacheFilaFiltrada.map(cli => { 
           let fipeDisplay = formatarMoedaBRL(cli.fipe || "").replace('💰 ', ''); 
           let veiculoDisplay = cli.placa ? cli.placa : (cli.chassi ? cli.chassi : "-"); 
           return `<tr>
                       <td style="text-align:center; font-weight:bold;">${cli.etapaNum === 1 ? "Boas Vindas" : cli.etapaNum === 2 ? "Alerta 5d" : "Prazo Exp"}</td>
                       <td style="font-weight:bold;">${cli.nome || "-"}</td>
                       <td>${veiculoDisplay}<br><span style="color:#10b981; font-weight:bold;">${fipeDisplay}</span></td>
                       <td>${cli.dataPlanilha || "-"}</td>
                       <td>${cli.dataEmail || "Aguardando..."}</td>
                       <td>${cli.email || "-"}<br>${cli.telefone || "-"}</td>
                       <td><b>${cli.estado || "N/A"}</b><br><span>${cli.cidade || ""}</span></td>
                       <td style="text-align:center; ${cli.isFipeBaixa ? 'color:red; font-weight:bold;' : ''}">${cli.isFipeBaixa ? 'SIM' : 'NÃO'}</td>
                       <td style="text-align:center; ${cli.isRespondeuEmail ? 'color:green; font-weight:bold;' : ''}">${cli.isRespondeuEmail ? 'SIM' : 'NÃO'}</td>
                       <td style="text-align:center; ${cli.isRespondeuWhats ? 'color:green; font-weight:bold;' : ''}">${cli.isRespondeuWhats ? 'SIM' : 'NÃO'}</td>
                   </tr>`; 
       }).join('');
       imprimirTabela("Fila Unificada", cabecalhos, linhasHTML);
    }

    function dispararImpressaoLogs() {
       if (!cacheLogsFiltrados || cacheLogsFiltrados.length === 0) return aviso("⚠️ Nenhum log para imprimir.");
       const linhasHTML = cacheLogsFiltrados.map(l => '<tr>' + (l.htmlArr || []).map(cel => '<td>' + cel + '</td>').join('') + '</tr>').join('');
       imprimirTabela("Central de Logs Unificada", cacheLogsBase.colunas || [], linhasHTML);
    }

    function alternarTelas(telaIdAlvo) { 
        ['tela-dashboard', 'tela-etapa', 'tela-cancelamento', 'tela-ferramentas', 'tela-config', 'tela-logs', 'tela-cadastro', 'tela-tecnicos', 'tela-manual', 'tela-usuarios'].forEach(id => { 
            const el = document.getElementById(id); 
            if(!el) return; 
            if (id === telaIdAlvo) { 
                el.classList.remove('hidden'); 
                el.classList.add('flex'); 
            } else { 
                el.classList.add('hidden'); 
                el.classList.remove('flex'); 
            } 
        }); 
    }
    
    function navegar(telaIdAlvo, btnElement) { 
      if(btnElement) { 
          document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active')); 
          btnElement.classList.add('active'); 
      } 
      alternarTelas(telaIdAlvo); 
      
      // Chamada segura dos módulos usando typeof
      if(telaIdAlvo === 'tela-dashboard' && typeof carregarDashboard === 'function') carregarDashboard(); 
      if(telaIdAlvo === 'tela-logs' && typeof carregarDadosDoLog === 'function') carregarDadosDoLog(); 
      if(telaIdAlvo === 'tela-config' && typeof carregarConfigs === 'function') carregarConfigs(); 
      if(telaIdAlvo === 'tela-tecnicos' && typeof carregarTecnicos === 'function') carregarTecnicos(); 
      if(telaIdAlvo === 'tela-usuarios' && typeof carregarUsuarios === 'function') carregarUsuarios(); 
    }

    window.onload = () => {
      if (typeof modalMigracaoHTML !== 'undefined') { document.body.insertAdjacentHTML('beforeend', modalMigracaoHTML); }
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) { 
          document.documentElement.classList.add('dark'); 
          const tI = document.getElementById('theme-icon'); 
          if(tI) tI.innerText = '☀️'; 
      }
      
      if (typeof checarSessaoAtiva === 'function') {
          const logado = checarSessaoAtiva(); 
          if (logado) {
              if (typeof VIEW_PARAM !== 'undefined') {
                  if (VIEW_PARAM === 'fila') { 
                      const sB = document.getElementById('sidebar'); 
                      if(sB) sB.classList.add('hidden'); 
                      if(typeof navegarFila === 'function') navegarFila(null); 
                  } 
                  else if (VIEW_PARAM === 'dash') { 
                      const sB = document.getElementById('sidebar'); 
                      if(sB) sB.classList.add('hidden'); 
                      if(typeof navegar === 'function') navegar('tela-dashboard', null); 
                  } 
                  else { 
                      const bM = document.getElementById('btn-nav-manual'); 
                      if(bM && typeof navegar === 'function') navegar('tela-manual', bM); 
                  }
              } else { 
                  const bM = document.getElementById('btn-nav-manual'); 
                  if(bM && typeof navegar === 'function') navegar('tela-manual', bM); 
              }
          }
      }
      setTimeout(verificarStatusAPIs, 1000); 
    };

    function verificarStatusAPIs() {
      const dotHinova = document.getElementById('dot-hinova');
      const hoverHinova = document.getElementById('hover-hinova');
      const dotViaCep = document.getElementById('dot-viacep');
      const hoverViaCep = document.getElementById('hover-viacep');
      
      if(!dotHinova || !dotViaCep) return;
      
      dotHinova.className = "w-3 h-3 rounded-full bg-slate-400 animate-pulse shadow-sm cursor-wait"; 
      if(hoverHinova) hoverHinova.innerHTML = "<div class='flex items-center gap-2 mb-1'><span class='text-slate-400'>📡</span> <b>Hinova (SGA)</b></div><span class='text-slate-400'>Aguardando...</span>";
      
      dotViaCep.className = "w-3 h-3 rounded-full bg-slate-400 animate-pulse shadow-sm cursor-wait"; 
      if(hoverViaCep) hoverViaCep.innerHTML = "<div class='flex items-center gap-2 mb-1'><span class='text-slate-400'>📮</span> <b>ViaCEP</b></div><span class='text-slate-400'>Aguardando...</span>";
      
      const startViaCep = performance.now();
      
      fetch('https://viacep.com.br/ws/01001000/json/')
          .then(res => { 
              const t = Math.round(performance.now() - startViaCep); 
              if (res.ok) { 
                  dotViaCep.className = "w-3 h-3 rounded-full bg-emerald-500 shadow-md shadow-emerald-500/40"; 
                  if(hoverViaCep) hoverViaCep.innerHTML = `<div class='flex items-center gap-2 mb-1'><span class='text-emerald-400'>🟢</span> <b>ViaCEP Online</b></div><div class='mt-2 text-[10px] text-emerald-400/70 font-mono'>Ping: ${t}ms</div>`; 
              } else throw new Error(res.status); 
          })
          .catch(e => { 
              dotViaCep.className = "w-3 h-3 rounded-full bg-rose-500 shadow-md shadow-rose-500/40 animate-bounce"; 
              if(hoverViaCep) hoverViaCep.innerHTML = `<div class='flex items-center gap-2 mb-1'><span class='text-rose-500'>🔴</span> <b>ViaCEP Offline</b></div>`; 
          });
          
      google.script.run
          .withSuccessHandler(res => { 
              if (res && res.hinova) { 
                  dotHinova.className = "w-3 h-3 rounded-full bg-emerald-500 shadow-md shadow-emerald-500/40"; 
                  if(hoverHinova) hoverHinova.innerHTML = `<div class='flex items-center gap-2 mb-1'><span class='text-emerald-400'>🟢</span> <b>Hinova (SGA)</b></div><div class='mt-2 text-[10px] text-emerald-400/70 font-mono'>Ping: ${res.tempo}ms</div>`; 
              } else { 
                  dotHinova.className = "w-3 h-3 rounded-full bg-rose-500 shadow-md shadow-rose-500/40 animate-bounce"; 
                  if(hoverHinova) hoverHinova.innerHTML = `<div class='flex items-center gap-2 mb-1'><span class='text-rose-500'>🔴</span> <b>Hinova Falhou</b></div>`; 
              } 
          })
          .web_testarAPIs();
    }
   
</script>
